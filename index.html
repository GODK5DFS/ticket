<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 Cylinder Engine Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>2 Cylinder Engine Simulator</h1>
        <div class="subtitle">จำลองการทำงานเครื่องยนต์ 2 สูบ</div>
        
        <div class="engine">
            <div class="cylinder left">
                <div class="chamber">
                    <div class="valve intake" id="v1-intake"></div>
                    <div class="valve exhaust" id="v1-exhaust"></div>
                    <div class="air" id="air1"></div>
                    <div class="fire" id="fire1"></div>
                    <div class="exhaust" id="ex1"></div>
                </div>
                <div class="piston" id="piston1"></div>
            </div>
            
            <div class="cylinder right">
                <div class="chamber">
                    <div class="valve intake" id="v2-intake"></div>
                    <div class="valve exhaust" id="v2-exhaust"></div>
                    <div class="air" id="air2"></div>
                    <div class="fire" id="fire2"></div>
                    <div class="exhaust" id="ex2"></div>
                </div>
                <div class="piston" id="piston2"></div>
            </div>

            <div class="rod" id="rod1"></div>
            <div class="rod" id="rod2"></div>

            <div class="crank-area">
                <div class="shaft"></div>
                <div class="crank left" id="crank1">
                    <div class="crank-pin"></div>
                </div>
                <div class="crank right" id="crank2">
                    <div class="crank-pin"></div>
                </div>
            </div>

            <div class="cylinder-label label1">Cylinder 1</div>
            <div class="cylinder-label label2">Cylinder 2</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
